services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_DATA_DIR: /app/data
      SCORE_CACHE_DIR: /app/dist/scores
      SCORE_RENDER_VERSION: ${SCORE_RENDER_VERSION:-1}
    volumes:
      - scores:/app/dist/scores
      - library:/app/data
    init: true
    mem_limit: 1g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    environment:
      SCORE_RENDER_VERSION: ${SCORE_RENDER_VERSION:-1}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    volumes:
      - scores:/app/dist/scores
      - library:/app/data
    network_mode: none
    init: true
    mem_limit: 3g
    cpus: 2
    stop_grace_period: 200s
    security_opt:
      - no-new-privileges:true

volumes:
  scores:
  library:
